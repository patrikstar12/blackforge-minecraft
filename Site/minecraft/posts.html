<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>پست‌ها | BlockForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #060606; --bg2: #0d0d0d; --bg3: #141414;
            --gold: #c8963e; --text: #e8e8e8; --text2: #a0a0a0; --text3: #666;
            --border: #1f1f1f; --radius: 14px; --safe-bottom: env(safe-area-inset-bottom, 16px);
            --green: #2ecc71; --blue: #3498db; --purple: #9b59b6; --orange: #e67e22;
            --premium-gold: #f0c040; --red: #e74c3c; --pink: #e91e63;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; font-size: 15px; }
        body {
            font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text);
            line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased;
            padding-bottom: calc(80px + var(--safe-bottom));
        }

        .header {
            background: rgba(6,6,6,0.95); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-icon {
            width: 34px; height: 34px; background: linear-gradient(135deg, #c8963e, #7a5a2e);
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: #fff; font-weight: 900; box-shadow: 0 3px 12px rgba(200,150,62,0.3);
        }
        .logo-text { font-weight: 900; font-size: 1.1rem; color: #fff; } .logo-text span { color: var(--gold); }
        .back-btn {
            width: 34px; height: 34px; border-radius: 50%; background: var(--bg3);
            border: 1px solid var(--border); color: #aaa; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem;
            transition: 0.2s; text-decoration: none;
        }
        .back-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .following-btn {
            width: 34px; height: 34px; border-radius: 50%; background: var(--bg3);
            border: 1px solid var(--border); color: #aaa; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem;
            transition: 0.2s; position: relative;
        }
        .following-btn:active { background: var(--gold); color: #000; border-color: var(--gold); }
        .following-btn .badge {
            position: absolute; top: -3px; right: -3px; background: var(--gold); color: #000;
            font-size: 0.45rem; width: 14px; height: 14px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            border: 2px solid #060606;
        }

        .posts-container { padding: 16px; max-width: 700px; margin: 0 auto; }

        /* ============ فیلترها ============ */
        .filter-chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-chip {
            padding: 6px 14px; border-radius: 18px; font-size: 0.68rem; font-weight: 600;
            cursor: pointer; transition: 0.2s; background: var(--bg3); border: 1px solid var(--border);
            color: #888; display: flex; align-items: center; gap: 5px;
        }
        .filter-chip:hover, .filter-chip.active { border-color: var(--gold); color: var(--gold); background: rgba(200,150,62,0.08); }
        .filter-chip.exam.active { border-color: var(--pink); color: var(--pink); background: rgba(233,30,99,0.08); }

        /* ============ بخش دنبال شده‌ها ============ */
        .followed-section {
            background: rgba(52,152,219,0.04); border: 1px solid rgba(52,152,219,0.2);
            border-radius: var(--radius); padding: 14px; margin-bottom: 16px; display: none;
        }
        .followed-section.show { display: block; }
        .followed-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
        }
        .followed-header h3 { font-size: 0.8rem; font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 6px; }
        .followed-list { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .followed-list::-webkit-scrollbar { display: none; }
        .followed-author-chip {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: var(--bg3); border: 1px solid var(--border); border-radius: 20px;
            cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        .followed-author-chip:hover { border-color: var(--gold); }
        .followed-author-chip img {
            width: 24px; height: 24px; border-radius: 50%; object-fit: cover;
        }
        .followed-author-chip span { font-size: 0.66rem; color: #bbb; font-weight: 600; }
        .followed-posts { margin-top: 10px; }
        .followed-post-item {
            padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: 0.2s;
        }
        .followed-post-item:hover { border-color: var(--gold); }
        .followed-post-item .fp-title { font-size: 0.76rem; font-weight: 700; color: #fff; }
        .followed-post-item .fp-meta { font-size: 0.6rem; color: #666; margin-top: 2px; display: flex; gap: 10px; }

        /* ============ کارت پست ============ */
        .posts-grid { display: flex; flex-direction: column; }
        .post-card {
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; margin-bottom: 16px; cursor: pointer; transition: 0.3s; position: relative;
        }
        .post-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .post-card.featured {
            border: 2px solid var(--premium-gold);
            box-shadow: 0 4px 20px rgba(240,192,64,0.2);
            order: -1;
        }
        .post-card.exam-card { border-color: rgba(233,30,99,0.3); }
        .post-cover { width: 100%; height: 180px; object-fit: cover; }
        .post-body { padding: 16px; }
        .post-category {
            display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.6rem;
            font-weight: 700; margin-bottom: 8px;
        }
        .post-category.news { background: rgba(52,152,219,0.15); color: var(--blue); }
        .post-category.tutorial { background: rgba(46,204,113,0.15); color: var(--green); }
        .post-category.update { background: rgba(168,85,247,0.15); color: var(--purple); }
        .post-category.event { background: rgba(230,126,34,0.15); color: var(--orange); }
        .post-category.exam { background: rgba(233,30,99,0.15); color: var(--pink); }
        .post-title { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1.6; }
        .post-excerpt { font-size: 0.78rem; color: #999; margin-bottom: 12px; line-height: 2; }
        .post-meta { display: flex; gap: 14px; font-size: 0.66rem; color: #666; flex-wrap: wrap; align-items: center; }
        .post-meta span { display: flex; align-items: center; gap: 4px; }
        .post-meta i { color: var(--gold); font-size: 0.7rem; }
        .post-author-link {
            color: var(--blue); text-decoration: none; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .post-author-link:hover { text-decoration: underline; }
        .post-featured-badge {
            position: absolute; top: 12px; left: 12px; z-index: 2;
            background: linear-gradient(135deg, var(--premium-gold), #c8963e);
            color: #000; padding: 4px 10px; border-radius: 8px; font-size: 0.58rem; font-weight: 700;
            box-shadow: 0 3px 12px rgba(240,192,64,0.4);
        }
        .post-exam-badge {
            display: inline-block; background: linear-gradient(135deg, var(--pink), #c2185b);
            color: #fff; padding: 3px 8px; border-radius: 8px; font-size: 0.56rem; font-weight: 700;
            margin-right: 6px;
        }
        .post-tags { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .post-tag {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            padding: 2px 8px; border-radius: 10px; font-size: 0.58rem; color: #777;
        }

        /* ============ صفحه جزئیات ============ */
        .post-detail { display: none; }
        .post-detail.active { display: block; }
        .post-detail-cover { width: 100%; height: 220px; object-fit: cover; border-radius: var(--radius); margin-bottom: 16px; }
        .post-detail h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .post-detail .content { font-size: 0.82rem; color: #bbb; line-height: 2.3; }
        .post-detail .content h3 { color: var(--gold); margin: 20px 0 10px; font-size: 1rem; }
        .post-detail .content h4 { color: #ccc; margin: 16px 0 8px; font-size: 0.9rem; }
        .post-detail .content ul, .post-detail .content ol { padding-right: 20px; margin: 10px 0; }
        .post-detail .content li { margin-bottom: 6px; }
        .post-detail .content strong { color: #fff; }

        /* ============ آزمون ============ */
        .exam-section {
            background: rgba(233,30,99,0.05); border: 1px solid rgba(233,30,99,0.3);
            border-radius: var(--radius); padding: 20px; margin-top: 20px;
        }
        .exam-section h3 { color: var(--pink); display: flex; align-items: center; gap: 8px; }
        .exam-question { margin-bottom: 16px; }
        .exam-question p { font-weight: 700; color: #fff; margin-bottom: 8px; }
        .exam-options { display: flex; flex-direction: column; gap: 6px; }
        .exam-opt {
            background: var(--bg3); border: 2px solid var(--border); border-radius: 10px;
            padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 0.78rem;
            color: var(--text2); transition: 0.2s; text-align: right; font-family: inherit;
        }
        .exam-opt:hover { border-color: var(--pink); color: #fff; }
        .exam-opt.selected { border-color: var(--pink); background: rgba(233,30,99,0.15); color: #fff; }
        .exam-opt.correct { border-color: var(--green); background: rgba(46,204,113,0.15); color: var(--green); }
        .exam-opt.wrong { border-color: var(--red); background: rgba(231,76,60,0.15); color: var(--red); }
        .exam-opt.saved-correct { border-color: var(--green) !important; background: rgba(46,204,113,0.15) !important; color: var(--green) !important; }
        .exam-opt.saved-wrong { border-color: var(--red) !important; background: rgba(231,76,60,0.15) !important; color: var(--red) !important; }
        .exam-opt:disabled { opacity: 0.85; cursor: default; pointer-events: none; }
        .exam-submit-btn {
            width: 100%; padding: 12px; border-radius: 12px; font-weight: 700;
            cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: 0.3s; border: none;
            background: linear-gradient(135deg, #e91e63, #c2185b); color: #fff;
            box-shadow: 0 4px 15px rgba(233,30,99,0.4); margin-top: 16px;
        }
        .exam-submit-btn:hover { transform: translateY(-2px); }
        .exam-submit-btn:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; box-shadow: none; }
        .exam-result {
            text-align: center; padding: 16px; margin-top: 12px;
            border-radius: 12px; font-size: 0.9rem; font-weight: 700;
        }
        .exam-locked-notice {
            text-align: center; padding: 12px; margin-top: 12px;
            background: rgba(241,196,15,0.08); border: 1px solid rgba(241,196,15,0.3);
            border-radius: 12px; font-size: 0.72rem; color: #f1c40f;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* ============ پروفایل نویسنده ============ */
        .author-profile { display: none; }
        .author-profile.active { display: block; }
        .author-header {
            text-align: center; padding: 24px 16px; margin-bottom: 20px;
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
        }
        .author-avatar {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--gold); box-shadow: 0 4px 20px rgba(200,150,62,0.3);
            margin-bottom: 12px;
        }
        .author-name { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .author-bio { font-size: 0.78rem; color: #888; line-height: 2; margin-bottom: 12px; }
        .author-stats { display: flex; gap: 20px; justify-content: center; margin-bottom: 12px; }
        .author-stat { text-align: center; }
        .author-stat .num { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
        .author-stat .lbl { font-size: 0.6rem; color: #888; }
        .follow-btn {
            padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer;
            font-size: 0.74rem; font-family: inherit; transition: 0.3s; border: 1px solid var(--gold);
            background: transparent; color: var(--gold); display: inline-flex; align-items: center; gap: 6px;
        }
        .follow-btn.following { background: var(--gold); color: #000; }
        .follow-btn:hover { transform: translateY(-1px); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(6,6,6,0.97); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 8px 0 calc(8px + var(--safe-bottom)); z-index: 50;
        }
        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: #555; text-decoration: none; font-size: 0.6rem; padding: 4px 8px; transition: 0.2s;
        }
        .bottom-nav a i { font-size: 1.2rem; }
        .bottom-nav a.active { color: var(--gold); }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-btn" id="headerBackBtn"><i class="fa-solid fa-arrow-right"></i></a>
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-cubes"></i></div>
            <div class="logo-text">Block<span>Forge</span></div>
        </div>
        <div class="header-right">
            <button class="following-btn" onclick="toggleFollowedSection()" title="دنبال شده‌ها">
                <i class="fa-solid fa-users"></i>
                <span class="badge" id="followBadge" style="display:none;">0</span>
            </button>
        </div>
    </header>

    <div class="posts-container">
        <!-- بخش دنبال شده‌ها -->
        <div class="followed-section" id="followedSection">
            <div class="followed-header">
                <h3><i class="fa-solid fa-users"></i> نویسنده‌های دنبال شده</h3>
                <button onclick="document.getElementById('followedSection').classList.remove('show')" style="background:transparent;border:none;color:#888;cursor:pointer;font-size:0.8rem;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="followed-list" id="followedList"></div>
            <div class="followed-posts" id="followedPosts"></div>
        </div>

        <!-- فیلترها -->
        <div class="filter-chips" id="filterChips">
            <span class="filter-chip active" data-filter="all"><i class="fa-solid fa-list"></i> همه</span>
            <span class="filter-chip" data-filter="news"><i class="fa-solid fa-newspaper"></i> اخبار</span>
            <span class="filter-chip" data-filter="tutorial"><i class="fa-solid fa-graduation-cap"></i> آموزش</span>
            <span class="filter-chip" data-filter="update"><i class="fa-solid fa-rotate"></i> آپدیت</span>
            <span class="filter-chip" data-filter="event"><i class="fa-solid fa-calendar"></i> رویداد</span>
            <span class="filter-chip exam" data-filter="exam"><i class="fa-solid fa-pen-to-square"></i> آزمون</span>
        </div>

        <!-- لیست پست‌ها -->
        <div class="posts-grid" id="postsList"></div>

        <!-- جزئیات پست -->
        <div class="post-detail" id="postDetail"></div>

        <!-- پروفایل نویسنده -->
        <div class="author-profile" id="authorProfile"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i> خانه</a>
        <a href="premium.html"><i class="fa-solid fa-crown" style="color:var(--premium-gold);"></i> پرمیوم</a>
        <a href="#" onclick="window.location.href='index.html';setTimeout(()=>parent.showSaved?.(),300);"><i class="fa-solid fa-bookmark"></i> ذخیره‌شده</a>
    </nav>

    <script src="posts.js"></script>
    <script>
        let posts = [];
        let activeFilter = 'all';
        let currentView = 'list';
        let currentAuthorSlug = null;

        // ==================== فالو ====================
        function getFollows() { return JSON.parse(localStorage.getItem('bf_follows') || '[]'); }
        function saveFollows(arr) { localStorage.setItem('bf_follows', JSON.stringify(arr)); }
        function isFollowing(slug) { return getFollows().includes(slug); }
        function toggleFollow(slug) {
            const f = getFollows();
            const idx = f.indexOf(slug);
            if (idx > -1) f.splice(idx, 1); else f.push(slug);
            saveFollows(f);
            updateFollowBadge();
            updateFollowedSection();
            if (currentView === 'author') updateAuthorUI();
        }

        function updateFollowBadge() {
            const f = getFollows();
            const badge = document.getElementById('followBadge');
            if (f.length > 0) { badge.style.display = 'flex'; badge.textContent = f.length; }
            else { badge.style.display = 'none'; }
        }

        function toggleFollowedSection() {
            const sec = document.getElementById('followedSection');
            sec.classList.toggle('show');
            if (sec.classList.contains('show')) updateFollowedSection();
        }

        function updateFollowedSection() {
            const f = getFollows();
            const list = document.getElementById('followedList');
            const postsList = document.getElementById('followedPosts');
            
            if (f.length === 0) {
                list.innerHTML = '<span style="color:#888;font-size:0.7rem;">کسی رو فالو نکردی. از پروفایل نویسنده‌ها فالوشون کن.</span>';
                postsList.innerHTML = '';
                return;
            }

            // لیست نویسنده‌های فالو شده
            list.innerHTML = f.map(slug => {
                const author = AUTHORS[slug];
                if (!author) return '';
                return `
                    <div class="followed-author-chip" onclick="showAuthor('${slug}')">
                        <img src="${author.avatar}" alt="${author.name}">
                        <span>${author.name}</span>
                    </div>
                `;
            }).join('');

            // آخرین مطالب نویسنده‌های فالو شده
            const followedPosts = posts.filter(p => f.includes(p.authorSlug)).slice(0, 5);
            if (followedPosts.length > 0) {
                postsList.innerHTML = '<h4 style="font-size:0.72rem;color:#888;margin-bottom:8px;">آخرین مطالب</h4>' + 
                    followedPosts.map(p => `
                        <div class="followed-post-item" onclick="showPost(${p.id})">
                            <div class="fp-title">${p.title}</div>
                            <div class="fp-meta">
                                <span><i class="fa-solid fa-user"></i> ${p.author}</span>
                                <span><i class="fa-solid fa-calendar"></i> ${p.date}</span>
                            </div>
                        </div>
                    `).join('');
            }
        }

        // ==================== لود ====================
        function loadPosts() {
            if (typeof POSTS === 'undefined') {
                document.getElementById('postsList').innerHTML = '<p style="color:#555;text-align:center;padding:40px;">هنوز پستی منتشر نشده</p>';
                return;
            }
            posts = POSTS.sort((a, b) => b.id - a.id);
            updateFollowBadge();
            showList();
        }

        function showList() {
            currentView = 'list';
            document.getElementById('filterChips').style.display = 'flex';
            document.getElementById('postsList').style.display = 'flex';
            document.getElementById('postDetail').classList.remove('active');
            document.getElementById('authorProfile').classList.remove('active');
            document.getElementById('headerBackBtn').href = 'index.html';
            document.getElementById('headerBackBtn').onclick = null;
            renderPosts();
        }

        function renderPosts() {
            let filtered = activeFilter === 'all' ? [...posts] : posts.filter(p => p.category === activeFilter);
            
            // مرتب‌سازی: ویژه‌ها اول
            filtered.sort((a, b) => {
                if (a.featured && !b.featured) return -1;
                if (!a.featured && b.featured) return 1;
                return 0;
            });

            const grid = document.getElementById('postsList');
            
            grid.innerHTML = filtered.map(p => `
                <div class="post-card ${p.featured ? 'featured' : ''} ${p.category === 'exam' ? 'exam-card' : ''}" onclick="showPost(${p.id})">
                    ${p.featured ? '<span class="post-featured-badge"><i class="fa-solid fa-star"></i> ویژه</span>' : ''}
                    <img class="post-cover" src="${p.cover}" alt="${p.title}" loading="lazy">
                    <div class="post-body">
                        <span class="post-category ${p.category}">${getCatName(p.category)}</span>
                        ${p.category === 'exam' ? '<span class="post-exam-badge"><i class="fa-solid fa-pen-to-square"></i> آزمون</span>' : ''}
                        <h3 class="post-title">${p.title}</h3>
                        <p class="post-excerpt">${p.excerpt}</p>
                        <div class="post-meta">
                            <span class="post-author-link" onclick="event.stopPropagation();showAuthor('${p.authorSlug}')">
                                <i class="fa-solid fa-user"></i> ${p.author}
                            </span>
                            <span><i class="fa-solid fa-calendar"></i> ${p.date}</span>
                            <span><i class="fa-solid fa-clock"></i> ${p.readTime}</span>
                        </div>
                        <div class="post-tags">${p.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
                    </div>
                </div>
            `).join('');

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color:#555;text-align:center;padding:40px;">پستی توی این دسته‌بندی نیست</p>';
            }
        }

        // ==================== نمایش پست ====================
        function showPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            currentView = 'detail';
            document.getElementById('filterChips').style.display = 'none';
            document.getElementById('postsList').style.display = 'none';
            document.getElementById('authorProfile').classList.remove('active');
            document.getElementById('followedSection').classList.remove('show');
            document.getElementById('postDetail').classList.add('active');
            document.getElementById('headerBackBtn').href = '#';
            document.getElementById('headerBackBtn').onclick = function(e) { e.preventDefault(); showList(); };

            // چک کردن آزمون قبلی
            let savedExam = null;
            if (post.category === 'exam' && post.examQuestions) {
                const savedExams = JSON.parse(localStorage.getItem('bf_exams') || '{}');
                savedExam = savedExams['exam_' + post.id] || null;
            }

            let examHTML = '';
            if (post.category === 'exam' && post.examQuestions) {
                if (savedExam) {
                    // آزمون قبلاً داده شده - فقط نمایش نتیجه
                    const pct = Math.round((savedExam.correct / savedExam.total) * 100);
                    examHTML = `
                        <div class="exam-section">
                            <h3><i class="fa-solid fa-clock-rotate-left"></i> نتیجه آزمون</h3>
                            <div class="exam-result" style="display:block;color:${pct >= 50 ? '#2ecc71' : '#e74c3c'};background:${pct >= 50 ? 'rgba(46,204,113,0.08)' : 'rgba(231,76,60,0.08)'};border:1px solid ${pct >= 50 ? 'rgba(46,204,113,0.3)' : 'rgba(231,76,60,0.3)'};">
                                ${savedExam.correct} از ${savedExam.total} (${pct}%) ${pct >= 50 ? '✅ قبول شدی!' : '❌ بیشتر تمرین کن!'}
                                <div style="font-size:0.65rem;color:#888;margin-top:4px;">تاریخ: ${savedExam.date || 'نامشخص'}</div>
                            </div>
                            ${post.examQuestions.map((q, i) => `
                                <div class="exam-question">
                                    <p>${i + 1}. ${q.q}</p>
                                    <div class="exam-options">
                                        ${q.opts.map((opt, j) => {
                                            let cls = '';
                                            if (j === q.ans) cls = ' saved-correct';
                                            else if (j === savedExam.answers[i] && j !== q.ans) cls = ' saved-wrong';
                                            return `<button class="exam-opt${cls}" disabled>${opt}</button>`;
                                        }).join('')}
                                    </div>
                                </div>
                            `).join('')}
                            <div class="exam-locked-notice">
                                <i class="fa-solid fa-lock"></i> این آزمون قبلاً ثبت شده و قابل تغییر نیست.
                            </div>
                        </div>
                    `;
                } else {
                    // آزمون جدید
                    examHTML = `
                        <div class="exam-section">
                            <h3><i class="fa-solid fa-pen-to-square"></i> به سوالات جواب بده!</h3>
                            <p style="color:#888;font-size:0.7rem;margin-bottom:12px;">⚠️ بعد از ثبت، دیگه نمیتونی جواب‌ها رو تغییر بدی.</p>
                            ${post.examQuestions.map((q, i) => `
                                <div class="exam-question">
                                    <p>${i + 1}. ${q.q}</p>
                                    <div class="exam-options">
                                        ${q.opts.map((opt, j) => `
                                            <button class="exam-opt" data-q="${i}" data-ans="${j}" onclick="selectExamAnswer(this, ${i}, ${j})">${opt}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                            <button class="exam-submit-btn" id="examSubmitBtn" onclick="submitExam(${post.id}, ${post.examQuestions.length})">
                                <i class="fa-solid fa-check"></i> ثبت نهایی (قابل تغییر نیست)
                            </button>
                            <div class="exam-result" id="examResult" style="display:none;"></div>
                        </div>
                    `;
                }
            }

            document.getElementById('postDetail').innerHTML = `
                <img class="post-detail-cover" src="${post.cover}" alt="${post.title}">
                <span class="post-category ${post.category}">${getCatName(post.category)}</span>
                ${post.featured ? '<span class="post-featured-badge" style="position:static;display:inline-block;margin-right:6px;"><i class="fa-solid fa-star"></i> ویژه</span>' : ''}
                <h2>${post.title}</h2>
                <div class="post-meta" style="margin-bottom:16px;">
                    <span class="post-author-link" onclick="showAuthor('${post.authorSlug}')">
                        <i class="fa-solid fa-user"></i> ${post.author}
                    </span>
                    <span><i class="fa-solid fa-calendar"></i> ${post.date}</span>
                    <span><i class="fa-solid fa-clock"></i> ${post.readTime}</span>
                </div>
                <div class="content">${post.content}</div>
                ${examHTML}
                <div class="post-tags" style="margin-top:16px;">${post.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
                <button onclick="showList()" style="margin-top:20px;padding:10px 20px;background:var(--bg3);border:1px solid var(--border);color:#aaa;border-radius:12px;cursor:pointer;font-family:inherit;font-size:0.78rem;width:100%;">
                    <i class="fa-solid fa-arrow-right"></i> برگشت به لیست
                </button>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== آزمون ====================
        let examAnswers = {};

        function selectExamAnswer(btn, qIdx, optIdx) {
            const opts = btn.parentElement.querySelectorAll('.exam-opt');
            opts.forEach(o => o.classList.remove('selected'));
            btn.classList.add('selected');
            examAnswers[qIdx] = optIdx;
        }

        function submitExam(postId, total) {
            const post = posts.find(p => p.id === postId);
            if (!post || !post.examQuestions) return;

            // چک کردن تکراری نبودن
            const savedExams = JSON.parse(localStorage.getItem('bf_exams') || '{}');
            if (savedExams['exam_' + postId]) {
                alert('این آزمون قبلاً ثبت شده!');
                return;
            }

            // چک کردن همه سوالات
            for (let i = 0; i < total; i++) {
                if (examAnswers[i] === undefined) {
                    const result = document.getElementById('examResult');
                    result.style.display = 'block';
                    result.style.color = '#e74c3c';
                    result.style.background = 'rgba(231,76,60,0.08)';
                    result.style.border = '1px solid rgba(231,76,60,0.3)';
                    result.textContent = 'لطفاً به همه سوالات جواب بده!';
                    return;
                }
            }

            let correct = 0;
            for (let i = 0; i < total; i++) {
                const q = document.querySelectorAll('.exam-question')[i];
                const btns = q.querySelectorAll('.exam-opt');
                
                btns.forEach((b, j) => {
                    b.disabled = true;
                    b.style.pointerEvents = 'none';
                    if (j === post.examQuestions[i].ans) b.classList.add('correct');
                    else if (j === examAnswers[i] && j !== post.examQuestions[i].ans) b.classList.add('wrong');
                });
                
                if (examAnswers[i] === post.examQuestions[i].ans) correct++;
            }

            // ذخیره نهایی - غیرقابل تغییر
            savedExams['exam_' + postId] = {
                answers: { ...examAnswers },
                correct: correct,
                total: total,
                date: new Date().toLocaleDateString('fa-IR'),
                locked: true
            };
            localStorage.setItem('bf_exams', JSON.stringify(savedExams));

            // غیرفعال کردن دکمه
            const submitBtn = document.getElementById('examSubmitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'ثبت شد ✓';
            }

            // نمایش نتیجه
            const pct = Math.round((correct / total) * 100);
            const result = document.getElementById('examResult');
            result.style.display = 'block';
            result.style.color = pct >= 50 ? '#2ecc71' : '#e74c3c';
            result.style.background = pct >= 50 ? 'rgba(46,204,113,0.08)' : 'rgba(231,76,60,0.08)';
            result.style.border = pct >= 50 ? '1px solid rgba(46,204,113,0.3)' : '1px solid rgba(231,76,60,0.3)';
            result.textContent = `نتیجه: ${correct} از ${total} (${pct}%) ${pct >= 50 ? '✅ قبول شدی!' : '❌ بیشتر تمرین کن!'}`;
            
            // نمایش پیام قفل
            const section = document.querySelector('.exam-section');
            if (section) {
                const lockNotice = document.createElement('div');
                lockNotice.className = 'exam-locked-notice';
                lockNotice.innerHTML = '<i class="fa-solid fa-lock"></i> این آزمون ثبت شده و قابل تغییر نیست.';
                section.appendChild(lockNotice);
            }

            examAnswers = {};
        }

        // ==================== پروفایل نویسنده ====================
        function showAuthor(slug) {
            if (!AUTHORS || !AUTHORS[slug]) return;
            
            currentView = 'author';
            currentAuthorSlug = slug;
            document.getElementById('filterChips').style.display = 'none';
            document.getElementById('postsList').style.display = 'none';
            document.getElementById('postDetail').classList.remove('active');
            document.getElementById('followedSection').classList.remove('show');
            document.getElementById('authorProfile').classList.add('active');
            document.getElementById('headerBackBtn').href = '#';
            document.getElementById('headerBackBtn').onclick = function(e) { e.preventDefault(); showList(); };

            updateAuthorUI();
        }

        function updateAuthorUI() {
            if (currentView !== 'author' || !currentAuthorSlug) return;
            const author = AUTHORS[currentAuthorSlug];
            const authorPosts = posts.filter(p => p.authorSlug === currentAuthorSlug);
            const following = isFollowing(currentAuthorSlug);

            document.getElementById('authorProfile').innerHTML = `
                <div class="author-header">
                    <img class="author-avatar" src="${author.avatar}" alt="${author.name}">
                    <div class="author-name">${author.name}</div>
                    <div class="author-bio">${author.bio}</div>
                    <div class="author-stats">
                        <div class="author-stat"><div class="num">${author.totalPosts}</div><div class="lbl">مطلب</div></div>
                        <div class="author-stat"><div class="num">${author.totalExams}</div><div class="lbl">آزمون</div></div>
                    </div>
                    <button class="follow-btn ${following ? 'following' : ''}" onclick="toggleFollow('${currentAuthorSlug}')">
                        <i class="fa-solid ${following ? 'fa-check' : 'fa-plus'}"></i>
                        ${following ? 'دنبال شده' : 'دنبال کردن'}
                    </button>
                </div>
                <h3 style="margin-bottom:12px;font-size:0.9rem;"><i class="fa-solid fa-newspaper"></i> مطالب ${author.name}</h3>
                ${authorPosts.map(p => `
                    <div class="post-card ${p.category === 'exam' ? 'exam-card' : ''}" onclick="showPost(${p.id})" style="cursor:pointer;">
                        <div class="post-body">
                            <span class="post-category ${p.category}">${getCatName(p.category)}</span>
                            <h3 class="post-title" style="font-size:0.85rem;">${p.title}</h3>
                            <p class="post-excerpt" style="font-size:0.7rem;">${p.excerpt.substring(0, 80)}...</p>
                            <div class="post-meta">
                                <span><i class="fa-solid fa-calendar"></i> ${p.date}</span>
                                <span><i class="fa-solid fa-clock"></i> ${p.readTime}</span>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function getCatName(cat) {
            const names = { news: 'اخبار', tutorial: 'آموزش', update: 'آپدیت', event: 'رویداد', exam: 'آزمون' };
            return names[cat] || cat;
        }

        // ==================== فیلتر ====================
        document.getElementById('filterChips').addEventListener('click', function(e) {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            activeFilter = chip.dataset.filter;
            renderPosts();
        });

        // ==================== راه‌اندازی ====================
        loadPosts();
    </script>
</body>
</html>
