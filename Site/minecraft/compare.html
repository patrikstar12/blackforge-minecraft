<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>مقایسه آیتم‌ها | BlockForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #060606; --bg2: #0d0d0d; --bg3: #141414;
            --gold: #c8963e; --text: #e8e8e8; --text2: #a0a0a0; --text3: #666;
            --border: #1f1f1f; --radius: 14px; --safe-bottom: env(safe-area-inset-bottom, 16px);
            --green: #2ecc71; --blue: #3498db; --purple: #9b59b6; --orange: #e67e22;
            --premium-gold: #f0c040; --red: #e74c3c; --pink: #e91e63;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; font-size: 15px; }
        body {
            font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text);
            line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased;
            padding-bottom: calc(80px + var(--safe-bottom));
        }

        .header {
            background: rgba(6,6,6,0.95); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-icon {
            width: 34px; height: 34px; background: linear-gradient(135deg, #c8963e, #7a5a2e);
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: #fff; font-weight: 900; box-shadow: 0 3px 12px rgba(200,150,62,0.3);
        }
        .logo-text { font-weight: 900; font-size: 1.1rem; color: #fff; } .logo-text span { color: var(--gold); }
        .back-btn {
            width: 34px; height: 34px; border-radius: 50%; background: var(--bg3);
            border: 1px solid var(--border); color: #aaa; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem;
            transition: 0.2s; text-decoration: none;
        }
        .back-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        .compare-container { padding: 16px; max-width: 800px; margin: 0 auto; }

        /* ============ سبد مقایسه ============ */
        .compare-basket {
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px; margin-bottom: 20px;
        }
        .basket-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .basket-header h3 { font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .basket-items { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .basket-item {
            display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            background: var(--bg3); border: 1px solid var(--border); border-radius: 20px;
            font-size: 0.68rem; color: #bbb;
        }
        .basket-item img {
            width: 28px; height: 28px; border-radius: 6px; object-fit: cover;
        }
        .basket-item .remove-btn {
            width: 18px; height: 18px; border-radius: 50%; background: rgba(231,76,60,0.2);
            border: none; color: #e74c3c; cursor: pointer; font-size: 0.5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .basket-empty { font-size: 0.72rem; color: #666; text-align: center; padding: 10px; }
        .basket-actions { display: flex; gap: 8px; }
        .basket-btn {
            padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
            font-size: 0.7rem; font-family: inherit; transition: 0.2s; border: none;
        }
        .basket-btn.compare { background: var(--gold); color: #000; }
        .basket-btn.compare:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; }
        .basket-btn.clear { background: transparent; color: #888; border: 1px solid var(--border); }

        /* ============ جدول مقایسه ============ */
        .compare-table-wrap {
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; display: none;
        }
        .compare-table-wrap.show { display: block; }
        .compare-table {
            width: 100%; border-collapse: collapse;
        }
        .compare-table th, .compare-table td {
            padding: 12px 10px; text-align: center; font-size: 0.7rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .compare-table th {
            background: rgba(255,255,255,0.02); font-weight: 700; color: #fff;
            position: sticky; top: 0;
        }
        .compare-table th:first-child {
            text-align: right; color: #888; font-weight: 600;
        }
        .compare-table td:first-child {
            text-align: right; color: #888; font-weight: 600;
            background: rgba(255,255,255,0.01);
        }
        .compare-table .item-header {
            padding: 14px 10px 8px;
        }
        .compare-table .item-header img {
            width: 50px; height: 50px; border-radius: 8px; object-fit: cover;
            margin-bottom: 6px;
        }
        .compare-table .item-header .name {
            font-size: 0.72rem; font-weight: 700; color: #fff; margin-bottom: 4px;
        }
        .compare-table .item-header .cat {
            font-size: 0.56rem; color: #888;
        }
        .best { color: var(--green) !important; font-weight: 700 !important; }
        .best-badge {
            display: inline-block; background: var(--green); color: #fff;
            padding: 2px 6px; border-radius: 4px; font-size: 0.5rem; font-weight: 700;
            margin-right: 4px;
        }
        .remove-col-btn {
            margin-top: 8px; padding: 4px 10px; border-radius: 6px;
            background: rgba(231,76,60,0.15); border: none; color: #e74c3c;
            cursor: pointer; font-size: 0.58rem; font-family: inherit;
        }

        /* ============ انتخاب آیتم برای مقایسه ============ */
        .search-compare-section { margin-bottom: 20px; }
        .search-compare-input {
            width: 100%; background: var(--bg3); border: 1px solid var(--border);
            border-radius: 22px; padding: 10px 16px; color: #fff;
            font-family: inherit; font-size: 0.82rem; outline: none; margin-bottom: 10px;
        }
        .search-compare-input:focus { border-color: var(--gold); }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .item-card {
            background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .item-card:hover { border-color: var(--gold); }
        .item-card.selected { border-color: var(--green); background: rgba(46,204,113,0.05); }
        .item-card img {
            width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
        }
        .item-card .info { flex: 1; min-width: 0; }
        .item-card .info .name { font-size: 0.66rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-card .info .price { font-size: 0.56rem; color: #888; }
        .item-card .check {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.5rem; color: transparent; flex-shrink: 0;
        }
        .item-card.selected .check {
            border-color: var(--green); background: var(--green); color: #fff;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(6,6,6,0.97); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 8px 0 calc(8px + var(--safe-bottom)); z-index: 50;
        }
        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: #555; text-decoration: none; font-size: 0.6rem; padding: 4px 8px; transition: 0.2s;
        }
        .bottom-nav a i { font-size: 1.2rem; }
        .bottom-nav a.active { color: var(--gold); }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-cubes"></i></div>
            <div class="logo-text">Block<span>Forge</span></div>
        </div>
        <div style="width:34px;"></div>
    </header>

    <div class="compare-container">
        <!-- سبد مقایسه -->
        <div class="compare-basket" id="basketSection">
            <div class="basket-header">
                <h3><i class="fa-solid fa-scale-balanced"></i> سبد مقایسه (<span id="basketCount">0</span>/3)</h3>
                <span style="font-size:0.62rem;color:#888;">حداکثر ۳ آیتم</span>
            </div>
            <div class="basket-items" id="basketItems">
                <div class="basket-empty">هنوز آیتمی انتخاب نکردی</div>
            </div>
            <div class="basket-actions">
                <button class="basket-btn compare" id="compareBtn" disabled onclick="showComparison()">
                    <i class="fa-solid fa-scale-balanced"></i> مقایسه کن
                </button>
                <button class="basket-btn clear" onclick="clearBasket()">
                    <i class="fa-solid fa-trash"></i> پاک کردن
                </button>
            </div>
        </div>

        <!-- جدول مقایسه -->
        <div class="compare-table-wrap" id="compareTableWrap">
            <table class="compare-table" id="compareTable"></table>
            <div style="padding:12px;text-align:center;">
                <button class="basket-btn clear" onclick="hideComparison()">
                    <i class="fa-solid fa-arrow-right"></i> برگشت به انتخاب
                </button>
            </div>
        </div>

        <!-- انتخاب آیتم -->
        <div class="search-compare-section" id="searchSection">
            <h3 style="font-size:0.85rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                <i class="fa-solid fa-magnifying-glass"></i> انتخاب آیتم برای مقایسه
            </h3>
            <input type="text" class="search-compare-input" placeholder="جستجو..." id="searchInput" oninput="filterItems()">
            <div class="items-grid" id="itemsGrid"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i> خانه</a>
        <a href="premium.html"><i class="fa-solid fa-crown" style="color:var(--premium-gold);"></i> پرمیوم</a>
        <a href="#" onclick="window.location.href='index.html';setTimeout(()=>parent.showSaved?.(),300);"><i class="fa-solid fa-bookmark"></i> ذخیره‌شده</a>
    </nav>

    <script src="mods.js"></script>
    <script>
        let items = [];
        let compareBasket = [];
        const MAX_COMPARE = 3;

        function build() {
            if (typeof MY_CONTENT === 'undefined') return [];
            return MY_CONTENT.map((i, idx) => ({ id: idx + 1, ...i, img: i.img || 'https://picsum.photos/seed/' + (idx + 1) + '/400/250' }));
        }

        function getPrice(item) {
            if (!item || !item.price) return { og: 0, fn: 0, hasD: false, d: 0 };
            const o = item.price, d = item.discount || 0;
            return { og: o, fn: Math.round(o - (o * d / 100)), hasD: d > 0, d };
        }
        function getCost(item) { const p = getPrice(item); return p.fn > 0 ? p.fn : 0; }

        // ==================== سبد مقایسه ====================
        function loadBasket() {
            const saved = JSON.parse(localStorage.getItem('bf_compare') || '[]');
            compareBasket = saved.filter(id => items.find(i => i.id === id));
            updateBasketUI();
        }

        function saveBasket() {
            localStorage.setItem('bf_compare', JSON.stringify(compareBasket));
        }

        function toggleItem(id) {
            const idx = compareBasket.indexOf(id);
            if (idx > -1) {
                compareBasket.splice(idx, 1);
            } else {
                if (compareBasket.length >= MAX_COMPARE) {
                    alert('حداکثر ' + MAX_COMPARE + ' آیتم می‌تونی مقایسه کنی!');
                    return;
                }
                compareBasket.push(id);
            }
            saveBasket();
            updateBasketUI();
            filterItems();
        }

        function removeItem(id) {
            const idx = compareBasket.indexOf(id);
            if (idx > -1) compareBasket.splice(idx, 1);
            saveBasket();
            updateBasketUI();
            filterItems();
        }

        function clearBasket() {
            compareBasket = [];
            saveBasket();
            updateBasketUI();
            filterItems();
            hideComparison();
        }

        function updateBasketUI() {
            const count = document.getElementById('basketCount');
            const itemsDiv = document.getElementById('basketItems');
            const compareBtn = document.getElementById('compareBtn');

            if (count) count.textContent = compareBasket.length;

            if (compareBasket.length === 0) {
                itemsDiv.innerHTML = '<div class="basket-empty">هنوز آیتمی انتخاب نکردی</div>';
                compareBtn.disabled = true;
            } else {
                itemsDiv.innerHTML = compareBasket.map(id => {
                    const item = items.find(i => i.id === id);
                    if (!item) return '';
                    const cost = getCost(item);
                    return `
                        <div class="basket-item">
                            <img src="${item.img}" alt="${item.title}">
                            <span>${item.title}</span>
                            <span style="color:${cost===0?'var(--green)':'var(--gold)'};font-size:0.6rem;">${cost===0?'رایگان':cost.toLocaleString('fa')}</span>
                            <button class="remove-btn" onclick="event.stopPropagation();removeItem(${id})"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                }).join('');
                compareBtn.disabled = compareBasket.length < 2;
            }
        }

        // ==================== جدول مقایسه ====================
        function showComparison() {
            if (compareBasket.length < 2) return;

            const compareItems = compareBasket.map(id => items.find(i => i.id === id)).filter(Boolean);
            if (compareItems.length < 2) return;

            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('basketSection').style.display = 'none';
            const wrap = document.getElementById('compareTableWrap');
            wrap.classList.add('show');

            // محاسبه بهترین‌ها
            const prices = compareItems.map(i => getCost(i));
            const ratings = compareItems.map(i => i.rating || 0);
            const sizes = compareItems.map(i => parseFloat(i.size) || 0);
            const bestPrice = Math.min(...prices);
            const bestRating = Math.max(...ratings);
            const bestSize = Math.min(...sizes);

            const table = document.getElementById('compareTable');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>ویژگی</th>
                        ${compareItems.map(i => `
                            <th class="item-header">
                                <img src="${i.img}" alt="${i.title}"><br>
                                <div class="name">${i.title}</div>
                                <div class="cat">${i.cat}</div>
                                <button class="remove-col-btn" onclick="removeItem(${i.id});hideComparison();">حذف</button>
                            </th>
                        `).join('')}
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>💰 قیمت</td>
                        ${compareItems.map(i => {
                            const cost = getCost(i);
                            const isBest = cost === bestPrice && cost > 0;
                            return `<td class="${isBest?'best':''}">${cost===0?'رایگان':cost.toLocaleString('fa')+' توکن'}${isBest?' <span class="best-badge">بهترین</span>':''}</td>`;
                        }).join('')}
                    </tr>
                    <tr>
                        <td>🏷️ تخفیف</td>
                        ${compareItems.map(i => {
                            const p = getPrice(i);
                            return `<td>${p.hasD ? '<span style="color:#e74c3c;">%'+p.d+'</span>' : '<span style="color:#888;">ندارد</span>'}</td>`;
                        }).join('')}
                    </tr>
                    <tr>
                        <td>⭐ امتیاز</td>
                        ${compareItems.map(i => {
                            const isBest = (i.rating||0) === bestRating && bestRating > 0;
                            return `<td class="${isBest?'best':''}">${i.rating||'-'}${isBest?' <span class="best-badge">بهترین</span>':''}</td>`;
                        }).join('')}
                    </tr>
                    <tr>
                        <td>📦 حجم</td>
                        ${compareItems.map(i => {
                            const sz = parseFloat(i.size) || 0;
                            const isBest = sz === bestSize && sz > 0;
                            return `<td class="${isBest?'best':''}">${i.size}${isBest?' <span class="best-badge">کمترین</span>':''}</td>`;
                        }).join('')}
                    </tr>
                    <tr>
                        <td>🔧 ورژن</td>
                        ${compareItems.map(i => `<td>${i.version}</td>`).join('')}
                    </tr>
                    <tr>
                        <td>👤 سازنده</td>
                        ${compareItems.map(i => `<td>${i.author}</td>`).join('')}
                    </tr>
                    <tr>
                        <td>📂 دسته‌بندی</td>
                        ${compareItems.map(i => `<td>${i.cat}</td>`).join('')}
                    </tr>
                </tbody>
            `;
        }

        function hideComparison() {
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('basketSection').style.display = 'block';
            document.getElementById('compareTableWrap').classList.remove('show');
            updateBasketUI();
            filterItems();
        }

        // ==================== فیلتر ====================
        function filterItems() {
            const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const grid = document.getElementById('itemsGrid');
            let filtered = items;
            if (q) {
                filtered = items.filter(i =>
                    i.title.toLowerCase().includes(q) ||
                    i.cat.includes(q) ||
                    i.author.toLowerCase().includes(q)
                );
            }

            grid.innerHTML = filtered.map(i => {
                const selected = compareBasket.includes(i.id);
                const cost = getCost(i);
                return `
                    <div class="item-card${selected?' selected':''}" onclick="toggleItem(${i.id})">
                        <img src="${i.img}" alt="${i.title}">
                        <div class="info">
                            <div class="name">${i.title}</div>
                            <div class="price">${cost===0?'رایگان':cost.toLocaleString('fa')+' توکن'}</div>
                        </div>
                        <div class="check"><i class="fa-solid fa-check"></i></div>
                    </div>
                `;
            }).join('');
        }

        // ==================== شروع ====================
        items = build();
        loadBasket();
        filterItems();
    </script>
</body>
</html>
